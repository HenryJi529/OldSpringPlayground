server:
  port: 8088
spring:
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: false
  datasource:
    url: jdbc:mysql://localhost:3306/old_springboot?useUnicode=true&characterEncoding=utf-8&useSSL=false
    username: root
    password: 1234asdw
    driver-class-name: com.mysql.jdbc.Driver
    initialization-mode: never
  redis:
    host: 127.0.0.1
    port: 6379
    password: ''
    database: 1 #Redis数据库索引【默认为0】
    timeout: PT10S # 连接超时时间

mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml
  type-aliases-package: com.morningstar.*.pojo.po
  configuration:
    # SQL 日志走 slf4j（由 logback 按 logging.level 输出），每次执行打印 SQL、参数、结果行数
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

logging:
  config: classpath:logback-spring.xml
  file: # handler
    path: ./logs
  pattern: # formatter
    dateformat: yyyy-MM-dd HH:mm:ss.SSS
    console: "%clr(%d{${LOG_DATEFORMAT_PATTERN}}){blue} [%thread] %clr([%level]){magenta} %logger{50} - %msg%n"
    file: "%d{${LOG_DATEFORMAT_PATTERN}} [%thread] %-5level %logger{50} - %msg%n"
  level: # logger-level
    root: info
    # mapper 接口包开 debug，配合 mybatis-plus log-impl 输出 SQL 日志
    com.morningstar.old.demo.mapper: debug
    org.springframework.transaction: debug
    org.springframework.jdbc.datasource.DataSourceTransactionManager: debug
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 30


