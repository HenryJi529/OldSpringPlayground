  ai:
    chat:
#      base-url: "https://api.deepseek.com"
#      api-key: "${DEEPSEEK_API_KEY}"
#      model: "deepseek-v4-flash"
      base-url: "https://api.siliconflow.cn/v1/chat/completions"
      api-key: "${SILICON_API_KEY}"
      model: "Qwen/Qwen3.6-35B-A3B"
      timeout-seconds: 120
    mcp:
      client:
        timeout-seconds: 300
        # MCP 服务列表：key = 名字（业务侧按名字注入），value = 端点 url
        # 均为本应用内嵌的 MCP server（/mcp/** 已白名单，自调用不会被认证拦截）
        endpoints:
          demo: "http://localhost:8088/mcp/demo"
        signing:
          private-key: "${MCP_PRIVATE_KEY}"
          public-key: "${MCP_PUBLIC_KEY}"
          issuer: "self"
          ttl-seconds: 300
      server:
        # 信任名册：iss → 该签发方的公钥（X.509 单行 base64）。新调用方接入 = 对方自产密钥对 + 此处登记公钥
        issuers:
          self: "${MCP_PUBLIC_KEY}"

